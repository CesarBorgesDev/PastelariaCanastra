services:
  pastelaria-db:
    image: postgres:16-alpine
    container_name: pastelaria-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pastelaria-db-data:/var/lib/postgresql/data
      - ./docker/postgres-entry.sh:/postgres-entry.sh:ro
    entrypoint: ["sh", "/postgres-entry.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - pastelaria

  pastelaria-backend:
    build: ./backend
    container_name: pastelaria-backend
    environment:
      POSTGRES_HOST: pastelaria-db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PRODUCTS_FILE: /app/products.json
      UPLOADS_DIR: /app/uploads
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/products.json:/app/products.json:ro
    depends_on:
      pastelaria-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - pastelaria

  pastelaria-frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: pastelaria-frontend
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      pastelaria-backend:
        condition: service_healthy
    networks:
      - pastelaria

volumes:
  pastelaria-db-data:

networks:
  pastelaria:
    name: pastelaria
