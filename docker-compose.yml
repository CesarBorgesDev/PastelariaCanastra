services:
  pastelaria-db:
    image: postgres:16-alpine
    container_name: pastelaria-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pastelaria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pastelaria}
      POSTGRES_DB: ${POSTGRES_DB:-pastelaria}
    volumes:
      - pastelaria-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pastelaria} -d ${POSTGRES_DB:-pastelaria}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - pastelaria

  pastelaria-backend:
    build: ./backend
    container_name: pastelaria-backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pastelaria}:${POSTGRES_PASSWORD:-pastelaria}@pastelaria-db:5432/${POSTGRES_DB:-pastelaria}
      PORT: 3000
      UPLOADS_DIR: /app/uploads
    volumes:
      - ./data/uploads:/app/uploads
    depends_on:
      pastelaria-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - pastelaria

  pastelaria-frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: pastelaria-frontend
    ports:
      - "${WEB_PORT:-8888}:80"
    depends_on:
      pastelaria-backend:
        condition: service_healthy
    networks:
      - pastelaria

volumes:
  pastelaria-db-data:

networks:
  pastelaria:
    name: pastelaria
